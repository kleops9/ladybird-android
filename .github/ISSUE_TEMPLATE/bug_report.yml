name: Report a bug
description: Tell us about something that doesn't work in Ladybird for Android.
body:
  - type: markdown
    attributes:
      value: |
        This is the tracker of Ladybird for Android, an unofficial port. Please report problems with the app here, not to the Ladybird project.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem in one or two short sentences.
      placeholder: When I … in Ladybird for Android, …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Menu › Settings › About Ladybird shows it.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page
      description: The address of the page where it happens, if it happens on a page.
      placeholder: https://example.com/
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, or how it behaves in Chrome or in Ladybird on a computer, help a lot.
